name: Lint and test
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
        timeout-minutes: 5
      # the tests run against the sources, so a build that no longer succeeds
      # would otherwise only be noticed at publish time
      - run: yarn build
